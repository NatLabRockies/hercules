# Input YAML for hercules
# Explicitly specify the parameters for demonstration purposes

# Name
name: 09_linear_generator

###
# Describe this simulation setup
description: Linear Generator Example

dt: 60.0  # 1 minute time step
starttime_utc: "2020-01-20T00:00:00Z"  # Midnight Jan 20, 2020 UTC
endtime_utc: "2020-01-20T07:00:00Z"  # 7 hours later
verbose: False

plant:
  interconnect_limit: 500  # kW

linear_generator:
  component_type: LinearGenerator
  capacity_rated: 250  # kW
  load_stable_min_fraction: 0.0  # Can operate at any load level
  ramp_rate_fraction_per_min: 1.2  # 120%/min — effectively instantaneous at 1-min time steps
  startup_time_hot: 90.0  # 1.5 minutes
  startup_time_warm: 450.0  # 7.5 minutes
  startup_time_cold: 900.0  # 15 minutes
  up_time_min: 300  # 5 minutes
  down_time_min: 300  # 5 minutes
  cooldown_time_warm: 2700.0  # 45 minutes (±15 minutes)
  cooldown_time_cold: 10800.0  # 3 hours (±1 hour)
  # Natural gas properties from [3] Staffell, "The Energy and Fuel Data Sheet", 2011
  # HHV: 39.05 MJ/m³, Density: 0.768 kg/m³
  HHV: 39050000  # J/m³ for natural gas (39.05 MJ/m³) [3]
  fuel_density: 0.768  # kg/m³ for natural gas [3]
  efficiency_table:
    power_fraction:
      - 1.00
      - 0.90
      - 0.30
      - 0.20
    efficiency:  # HHV net plant efficiency from [1]; peak across mid-load, roll-off at extremes
      - 0.40
      - 0.4144
      - 0.4144
      - 0.35
  log_channels:
    - power
    - fuel_volume_rate
    - fuel_mass_rate
    - state
    - efficiency
    - power_setpoint
  initial_conditions:
    power: 250  # Start ON at rated capacity (250 kW)

controller:
