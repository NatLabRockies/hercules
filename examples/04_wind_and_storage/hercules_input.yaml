# Input YAML for hercules

# Name
name: example_03

###
# Describe this simulation setup
description: Wind and solar

dt: 1.0
starttime_utc: "2024-06-24T16:59:08Z" # Jun 24, 2024 16:59:08 UTC (Zulu time)
endtime_utc: "2024-06-26T16:59:00Z" # ≈48 hours later (Jun 26, 2024 16:59:00 UTC)
verbose: False


plant:
  interconnect_limit: 45000 # kW


wind_farm:
  component_type: WindFarm
  wake_method: precomputed
  floris_input_filename: ../inputs/floris_input_large.yaml
  wind_input_filename: ../inputs/wind_input_large.ftr
  turbine_filename: ../inputs/turbine_filter_model.yaml
  log_filename: log_wind_sim.log
  log_channels:
    - power
  floris_update_time: 300.0 # Update wakes every 5 minutes

battery:
  component_type: BatteryDynamic
  energy_capacity: 10000 # total capacity of the battery in kWh (10 MWh)
  power_charge_max: 10000 # charge rate in kW (10 MW)
  power_discharge_max: 10000 # discharge rate in kW (10 MW)
  SOC_max: 0.9
  SOC_min: 0.1
  log_channels:
    - power
    - SOC
    - power_setpoint
  allow_grid_power_consumption: False
  initial_conditions:
    SOC: 0.5

controller:
