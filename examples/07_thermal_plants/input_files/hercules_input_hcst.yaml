# Input YAML for hercules
# Explicitly specify the parameters for demonstration purposes

# Name
name: example_07_1

###
# Describe this simulation setup
description: Hard Coal Steam Turbine (HCST) Example

dt: 60.0  # 1 minute time step
starttime_utc: "2020-01-01T00:00:00Z"  # Midnight Jan 1, 2020 UTC
endtime_utc: "2020-01-10T00:00:00Z"  # 10 days later
verbose: False

plant:
  interconnect_limit: 500000  # kW (500 MW)
  # Define the power setpoint schedule for the plant
  power_setpoint_schedule:
    time: # Time in seconds from start
      - 0
      - 43200
      - 129600
      - 388800
      - 561600
      - 648000
      - 777600
    power_setpoint_fraction:
      - 1.0
      - 0.0
      - 1.0
      - 0.5
      - 0.1
      - 1.0
      - 0.0

steam_turbine:
  component_type: SteamTurbine
  capacity_rated: 500000  # kW (500 MW)
  load_stable_min_fraction: 0.3  # 30% minimum operating point
  ramp_rate_fraction_per_min: 0.03  # 3%/min ramp rate
  run_up_rate_fraction_per_min: 0.02  # 2%/min run up rate
  startup_time_hot: 27000.0  # 7.5 hours
  startup_time_warm: 27000.0  # 7.5 hours
  startup_time_cold: 27000.0  # 7.5 hours
  up_time_min: 172800  # 48 hours
  down_time_min: 172800  # 48 hour
  efficiency_table:
    power_fraction:
      - 1.0
      - 0.50
      - 0.30
    efficiency:  # HHV net plant efficiency, fractions (0-1)
      - 0.35
      - 0.32
      - 0.32
  log_channels:
    - power
    - fuel_volume_rate
    - fuel_mass_rate
    - state
    - efficiency
    - power_setpoint
  initial_conditions:
    power: 500000  # Start ON at rated capacity

controller:
